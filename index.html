<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superfast Inference — Your agents, 10x faster.</title>
<meta name="description" content="Same models. Same price. A tenth of the wait. Open-weights inference built for agents.">
<meta property="og:title" content="Superfast Inference">
<meta property="og:description" content="Your agents, 10x faster. Same models. Same price. A tenth of the wait.">
<meta property="og:url" content="https://superfastinference.com">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F0ECE2'/%3E%3Cg fill='%23C4340C'%3E%3Ccircle cx='8' cy='8' r='3'/%3E%3Ccircle cx='16' cy='8' r='3'/%3E%3Ccircle cx='24' cy='8' r='3'/%3E%3Ccircle cx='8' cy='16' r='3'/%3E%3Ccircle cx='8' cy='24' r='3'/%3E%3Ccircle cx='16' cy='24' r='3'/%3E%3Ccircle cx='24' cy='24' r='3'/%3E%3Ccircle cx='24' cy='16' r='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;800;900&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F0ECE2;
    --ink: #191712;
    --ember: #C4340C;
    --mute: #6E695E;
    --faint: #9B9588;
    --line: #C6C0B2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fragment Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 880px;
  }

  h1 {
    font-family: 'Doto', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 11vw, 108px);
    line-height: 1.04;
    letter-spacing: -0.01em;
  }

  .sweep {
    position: relative;
    overflow: hidden;
    width: fit-content;
    max-width: 100%;
  }

  .sweep .reveal {
    clip-path: inset(0 100% 0 0);
    animation: sweepin 1.15s steps(24, end) forwards;
  }

  .sweep .head {
    position: absolute;
    top: 6%;
    bottom: 6%;
    left: 0;
    width: 3px;
    background: var(--ember);
    animation: headmove 1.15s steps(24, end) forwards;
  }

  .sweep.l2 { color: var(--ember); }
  .sweep.l2 .reveal { animation-delay: 1.05s; }
  .sweep.l2 .head { animation-delay: 1.05s; opacity: 0; }

  @keyframes sweepin {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 -2% 0 0); }
  }

  @keyframes headmove {
    0%   { left: 0; opacity: 1; }
    99%  { left: calc(100% - 3px); opacity: 1; }
    100% { left: calc(100% - 3px); opacity: 0; }
  }

  .below {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 56px;
    opacity: 0;
    animation: fadein .8s ease 2.5s forwards;
  }

  @keyframes fadein { to { opacity: 1; } }

  .tagline {
    font-size: 14px;
    line-height: 1.75;
    color: var(--mute);
  }

  .tagline strong {
    color: var(--ink);
    font-weight: 400;
  }

  form {
    display: flex;
    align-items: stretch;
  }

  input[type="email"] {
    font-family: 'Fragment Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--line);
    border-right: none;
    padding: 14px 18px;
    width: 240px;
    outline: none;
    border-radius: 0;
  }

  input[type="email"]::placeholder { color: var(--faint); }

  input[type="email"]:focus { border-color: var(--ink); }

  button {
    font-family: 'Fragment Mono', monospace;
    font-size: 13px;
    color: var(--paper);
    background: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 14px 22px;
    cursor: pointer;
    white-space: nowrap;
  }

  button:hover { background: var(--ember); border-color: var(--ember); }

  .cta { position: relative; }

  .note {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap;
  }

  .note a { color: var(--mute); }

  @media (max-width: 560px) {
    .below { margin-top: 40px; }
    form { width: 100%; flex-wrap: wrap; gap: 8px; }
    input[type="email"] { width: 100%; border-right: 1.5px solid var(--line); }
    button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sweep .reveal { animation: none; clip-path: none; }
    .sweep .head { display: none; }
    .below { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>
    <span class="sweep l1"><span class="reveal">Your agents,</span><span class="head"></span></span>
    <span class="sweep l2"><span class="reveal">10x faster.</span><span class="head"></span></span>
  </h1>

  <div class="below">
    <p class="tagline">Same models. Same price.<br><strong>A tenth of the wait.</strong></p>

    <div class="cta">
      <form id="access" novalidate>
        <input type="email" name="email" placeholder="you@company.com" required autocomplete="email" aria-label="Work email">
        <button type="submit">request_access &crarr;</button>
      </form>
      <p class="note" id="note"></p>
    </div>
  </div>
</main>

<script>
  const form = document.getElementById('access');
  const note = document.getElementById('note');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      note.textContent = 'that does not look like an email.';
      return;
    }
    note.textContent = 'sending…';
    try {
      const res = await fetch('https://api.superfastinference.com/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (!res.ok) throw new Error();
      form.reset();
      note.textContent = 'you are on the list.';
    } catch {
      note.innerHTML = 'could not reach the server — mail <a href="mailto:hello@superfastinference.com">hello@superfastinference.com</a> instead.';
    }
  });
</script>
</body>
</html>
